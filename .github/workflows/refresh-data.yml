name: Refresh Data

# One workflow, four explicit modes (2026-09-06):
#   full        FRED + regimes + signals + market + analytics + news, validated, published
#   news-only   the hourly news feed on a lean dependency set
#   market-only daily + intraday market bars on a lean dependency set
#   verify-only download, validate, report — never uploads
# The mode is resolved by scripts/workflow_mode.py from the trigger, so an
# hourly run can never masquerade as a full refresh. Every mode validates the
# database (scripts/validate_db.py) before publishing; a failed validation
# leaves the previous Release asset — the last-known-good snapshot — in place.

on:
  schedule:
    - cron: "17 11 * * *"   # full · 11:17 UTC daily, before the US open (off the top of the hour)
    - cron: "23 0 * * 2-6"  # full · 00:23 UTC Tue–Sat, after the US close
    - cron: "41 * * * *"    # news-only · hourly at :41
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        type: choice
        options: [full, news-only, market-only, verify-only]
        default: full
      allow_stale_reason:
        description: "Documented reason to publish a snapshot that is outside its freshness SLA (leave empty to enforce)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write   # dispatches the memo workflows after a validated morning full refresh

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      verdict: ${{ steps.validate.outputs.verdict }}
      upload: ${{ steps.validate.outputs.upload }}

    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve refresh mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE=$(python scripts/workflow_mode.py --event "$EVENT_NAME" --schedule "$SCHEDULE" --input "$INPUT_MODE")
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE (event=$EVENT_NAME schedule='$SCHEDULE')"
          if [ "$(date -u +%H)" -lt 18 ]; then echo "slot=morning" >> "$GITHUB_OUTPUT"; else echo "slot=evening" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies (full)
        if: steps.mode.outputs.mode == 'full'
        run: pip install -r requirements.txt -r requirements-snapshot.txt

      - name: Install dependencies (news-only)
        if: steps.mode.outputs.mode == 'news-only'
        run: pip install -r requirements-news.txt

      - name: Install dependencies (market-only)
        if: steps.mode.outputs.mode == 'market-only'
        run: pip install -r requirements-market.txt

      - name: Fetch current DB snapshot from data-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if gh release view data-latest >/dev/null 2>&1; then
            gh release download data-latest --pattern macro_radar.db --dir data --clobber
            cp data/macro_radar.db data/previous.db
            echo "DB snapshot: $(du -h data/macro_radar.db | cut -f1)"
          else
            echo "No data-latest release yet; proceeding without a prior DB."
          fi

      - name: Write .env for scripts that use load_dotenv()
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'news-only'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          {
            echo "FRED_API_KEY=$FRED_API_KEY"
            echo "FINNHUB_API_KEY=$FINNHUB_API_KEY"
            echo "NEWS_API_KEY=$NEWS_API_KEY"
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "PERPLEXITY_API_KEY=$PERPLEXITY_API_KEY"
          } > .env

      - name: Run FRED pipeline (fetch + regimes + signals)
        if: steps.mode.outputs.mode == 'full'
        run: python main.py

      - name: Fetch market data (incremental)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'market-only'
        run: python src/market_data/fetch_market.py --mode incremental

      # fix/prelaunch-1: allocation's price histories, stored so the API never
      # downloads them. EODHD first where a token is configured (none is here,
      # deliberately), Yahoo as the disclosed fallback, one provider per
      # series. The step never fails the refresh; validate_db judges the table.
      - name: Store allocation price histories
        if: steps.mode.outputs.mode == 'full'
        run: python -m src.market_data.asset_history

      # desk/event-study: the Desk's daily series (src/market_data/desk_history.py),
      # FRED direct (the .env above carries the key) plus, at tier 2, market
      # series through the same EODHD-first/Yahoo-fallback path as the step
      # above. Tier 1 makes no provider calls. Never fails the refresh;
      # validate_db judges the table.
      - name: Store Desk daily series
        if: steps.mode.outputs.mode == 'full'
        run: python -m src.market_data.desk_history --tier 1

      - name: Fetch intraday bars
        if: steps.mode.outputs.mode == 'market-only'
        run: python src/market_data/fetch_market.py --mode intraday-only

      - name: Compute macro surprises (z-scores)
        if: steps.mode.outputs.mode == 'full'
        run: python -m src.analytics.surprise

      - name: Compute backtest results
        if: steps.mode.outputs.mode == 'full'
        run: python -m src.analytics.backtest

      - name: Generate alert feed
        if: steps.mode.outputs.mode == 'full'
        run: python -m src.analytics.alerts

      - name: Compute priced metrics
        if: steps.mode.outputs.mode == 'full'
        run: python -m src.analytics.priced

      - name: Generate regime playbook
        if: steps.mode.outputs.mode == 'full'
        run: python -m src.analytics.playbook

      - name: Reload event calendar (idempotent)
        if: steps.mode.outputs.mode == 'full'
        run: python src/events/load_events.py

      # B5: large-cap earnings dates (Finnhub, 90 days ahead) after the manual
      # calendar, so a hand-maintained row is in place to win. The module prints
      # one summary line and exits 0 on a missing key or a Finnhub error.
      - name: Load earnings calendar
        if: steps.mode.outputs.mode == 'full'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m src.events.earnings

      - name: Refresh news feed
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'news-only'
        env:
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY:       ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from src.db_helpers import ensure_news_table
          from src.analytics.news import fetch_and_store_news
          ensure_news_table('data/macro_radar.db')
          n = fetch_and_store_news('data/macro_radar.db', {
              'finnhub_key':    os.environ.get('FINNHUB_API_KEY',''),
              'newsapi_key':    os.environ.get('NEWS_API_KEY',''),
              'anthropic_key':  os.environ.get('ANTHROPIC_API_KEY',''),
              'perplexity_key': os.environ.get('PERPLEXITY_API_KEY',''),
          })
          print(f'Stored {n} new headlines')
          "

      - name: Trim intraday data to last 30 days (prevent DB bloat)
        if: steps.mode.outputs.mode == 'full'
        run: |
          sqlite3 data/macro_radar.db "DELETE FROM market_intraday WHERE ts < datetime('now','-30 days');"
          sqlite3 data/macro_radar.db "VACUUM;"

      - name: Checkpoint WAL into main DB file
        if: steps.mode.outputs.mode != 'verify-only'
        run: sqlite3 data/macro_radar.db "PRAGMA wal_checkpoint(FULL);"

      - name: Clean up .env before publishing
        if: always()
        run: rm -f .env

      - name: Validate the refreshed database
        id: validate
        env:
          ALLOW_STALE: ${{ github.event.inputs.allow_stale_reason }}
        run: |
          set +e
          ARGS=()
          [ -f data/previous.db ] && ARGS+=(--previous data/previous.db)
          python scripts/validate_db.py data/macro_radar.db "${ARGS[@]}" --mode "${{ steps.mode.outputs.mode }}" --allow-stale "$ALLOW_STALE" --json validation.json
          RC=$?
          set -e
          echo "validation exit code: $RC"
          if [ "$RC" -ne 0 ]; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::error::Validation failed — the previous data-latest asset stays in place (last-known-good)."
            exit 1
          fi

      - name: Build the public static snapshot
        if: steps.mode.outputs.mode == 'full' && steps.validate.outputs.verdict == 'pass'
        env:
          EODHD_PROBE_ON_START: "0"
        run: python scripts/build_snapshot.py --out snapshot-latest.json

      - name: Publish validated DB snapshot to data-latest release
        if: steps.mode.outputs.mode != 'verify-only' && steps.validate.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data-latest >/dev/null 2>&1 \
            || gh release create data-latest --title "Latest data snapshot" \
                 --notes "Rolling SQLite snapshot published by the refresh workflows. Not stored in git history."
          gh release upload data-latest data/macro_radar.db --clobber
          echo "Uploaded DB snapshot ($(du -h data/macro_radar.db | cut -f1)) to data-latest."
          if [ -f snapshot-latest.json ]; then
            gh release upload data-latest snapshot-latest.json --clobber
            echo "Uploaded snapshot-latest.json ($(du -h snapshot-latest.json | cut -f1))."
          fi

      - name: Note when nothing changed
        if: steps.mode.outputs.mode != 'verify-only' && steps.validate.outputs.upload != 'true'
        run: echo "Validation passed but nothing changed for mode ${{ steps.mode.outputs.mode }}; the previous asset stands." >> "$GITHUB_STEP_SUMMARY"

      - name: Record the validated run for downstream memos
        if: steps.mode.outputs.mode == 'full' && steps.validate.outputs.verdict == 'pass'
        run: |
          mkdir -p validated
          cp data/macro_radar.db validated/macro_radar.db
          cp validation.json validated/validation.json
          printf 'mode=%s\nslot=%s\nrun_id=%s\n' "${{ steps.mode.outputs.mode }}" "${{ steps.mode.outputs.slot }}" "${{ github.run_id }}" > validated/refresh-meta.txt

      - name: Upload the validated snapshot as a run artifact
        if: steps.mode.outputs.mode == 'full' && steps.validate.outputs.verdict == 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: validated-db
          path: validated/
          retention-days: 3

      - name: Dispatch the memo workflows (validated morning full refresh only)
        if: steps.mode.outputs.mode == 'full' && steps.validate.outputs.verdict == 'pass' && steps.mode.outputs.slot == 'morning'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" -le 5 ]; then
            gh workflow run daily-memo.yml -f run_id="$RUN_ID" && echo "daily memo dispatched for run $RUN_ID"
          fi
          if [ "$DOW" -eq 1 ]; then
            gh workflow run weekly-memo.yml -f run_id="$RUN_ID" && echo "weekly memo dispatched for run $RUN_ID"
          fi

      - name: Commit playbook.json if it changed
        if: steps.mode.outputs.mode == 'full' && steps.validate.outputs.verdict == 'pass'
        run: |
          if git diff --quiet output/playbook.json 2>/dev/null; then
            echo "playbook.json unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output/playbook.json
            git commit -m "Update playbook [skip ci]"
            COMMIT_MSG=$(git log -1 --pretty=%B)
            # Same retry/soft-reset pattern as before; only a tiny text file now.
            for i in 1 2 3 4 5; do
              if git fetch origin main \
                 && git reset --soft origin/main \
                 && git commit -m "$COMMIT_MSG" \
                 && git push; then
                echo "Push succeeded on attempt $i"
                exit 0
              fi
              echo "Attempt $i failed (fetch/reset/commit/push), retrying..."
              sleep $((RANDOM % 10 + 5))
            done
            echo "Push failed after 5 attempts"
            exit 1
          fi
