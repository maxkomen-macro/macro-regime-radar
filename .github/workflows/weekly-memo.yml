name: Weekly Memo Email

# CS-2 (Max 2026-11-05 item 6; design .loop/design-CS2.md v16): one weekly memo per
# ISO week, from the first validated full refresh started on that week's Monday
# (UTC, any hour), from a durable queue in git:
#
#   docs/memo/sources.json        which validated refresh attempt first covered each
#                                 week, and the session its prices are pinned to (the
#                                 newest session that snapshot covered)
#   docs/memo/ledger-weekly.json  each week's memo state
#
# Modes: wake (or the legacy run_id) drains the queue; resend_key resends a terminal
# week (docs/RUNBOOK.md); no input is a manual run as before, never recorded.
# The weekly memo makes no Anthropic or Perplexity call on any path: its commentary is
# built locally by src/memo.py, and this workflow holds neither key (DR-64).
# Every ledger write is a compare-and-swap through scripts/publish_artifacts.sh
# --expect. Automation never sends a week again after SMTP may have accepted it:
# at-most-once for automation with visible failures, not exactly-once delivery.

on:
  workflow_dispatch:
    inputs:
      wake:
        description: "Set by Refresh Data or a chained memo run: drain the memo queue (leave empty for a manual run)"
        type: string
        default: ""
      run_id:
        description: "Legacy wake-up from a pre-CS-2 refresh: treated as a wake-up only (leave empty)"
        type: string
        default: ""
      resend_key:
        description: "Owner resend: the ISO week (GGGG-Www) to send again; only a terminal ledger entry (docs/RUNBOOK.md)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write   # reads source runs' artifacts, uploads the outcome, chains the next run

concurrency:
  group: ${{ (inputs.wake != '' || inputs.run_id != '' || inputs.resend_key != '') && 'weekly-memo-queue' || format('weekly-memo-manual-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # Private storage (Change 1, docs/data/PRIVATE_STORAGE.md): the repo whose
  # data-latest release holds the database, validation.json,
  # snapshot-latest.json and the full refresh's attempt status. Unset, it is
  # this repo, exactly as before. A different repo needs the DATA_RELEASE_TOKEN secret.
  # The earnings ledger steps never read it: the sealed ledger stays here.
  DATA_RELEASE_REPO: ${{ vars.DATA_RELEASE_REPO || github.repository }}

jobs:
  email-memo:
    runs-on: ubuntu-latest
    timeout-minutes: 110

    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MEMO_MODE: ${{ inputs.resend_key != '' && 'resend' || ((inputs.wake != '' || inputs.run_id != '') && 'auto' || 'manual') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # The queued steps import api/ code (pin -> asset_history -> api.providers.eodhd
        # needs httpx), so the job installs what the full refresh installs.
        run: pip install -r requirements.txt -r requirements-snapshot.txt

      - name: Configure the git identity for memo commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── queued memo (automated or resend) ──────────────────────────────────

      - name: Plan the memo
        id: plan
        if: env.MEMO_MODE != 'manual' && github.ref == 'refs/heads/main'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKE: ${{ inputs.wake || inputs.run_id }}
          RESEND_KEY: ${{ inputs.resend_key }}
        run: python scripts/memo_queue.py plan --kind weekly --wake "$WAKE" --resend-key "$RESEND_KEY"

      - name: Download the source snapshot
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          name: validated-db
          path: validated
          run-id: ${{ steps.plan.outputs.origin_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the source snapshot
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 10
        env:
          DB_SHA: ${{ steps.plan.outputs.db_sha256 }}
          VAL_SHA: ${{ steps.plan.outputs.validation_sha256 }}
          VALIDATED_AT: ${{ steps.plan.outputs.validated_at }}
        run: |
          python scripts/memo_queue.py verify --db validated/macro_radar.db --validation validated/validation.json \
            --db-sha256 "$DB_SHA" --validation-sha256 "$VAL_SHA"
          mkdir -p data
          cp validated/macro_radar.db data/macro_radar.db
          python scripts/validate_db.py data/macro_radar.db --mode verify-only --allow-stale "memo input: validated upstream at $VALIDATED_AT"

      - name: Write .env for scripts that use load_dotenv()
        if: steps.plan.outputs.go == 'true' || env.MEMO_MODE == 'manual'
        run: echo "FRED_API_KEY=${{ secrets.FRED_API_KEY }}" > .env

      # DR-50, DR-58, DR-71: the analytics recomputed from the source's own rows as of the
      # pinned session P, in this order, under the content clock. No module between the
      # market metrics and the alert fix-up writes a market weekly row.
      - name: Pin the private copy and recompute its analytics
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 20
        env:
          PIN: ${{ steps.plan.outputs.pin_session }}
          MEMO_CLOCK: ${{ steps.plan.outputs.validated_at }}
        run: |
          python scripts/memo_queue.py pin --db data/macro_radar.db --session "$PIN"
          python -m src.analytics.surprise
          python scripts/memo_queue.py market-metrics --db data/macro_radar.db --session "$PIN"
          python -m src.analytics.backtest
          python -m src.analytics.alerts
          python -m src.analytics.priced
          python -m src.analytics.playbook
          python scripts/memo_queue.py market-alerts --db data/macro_radar.db --session "$PIN"

      - name: Generate weekly memo
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 20
        env:
          MEMO_KEY: ${{ steps.plan.outputs.key }}
          MEMO_SESSION: ${{ steps.plan.outputs.pin_session }}
          MEMO_CLOCK: ${{ steps.plan.outputs.validated_at }}
        run: python -m src.memo

      - name: Publish the memo page and mark it sending
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/memo_queue.py publish --kind weekly --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}"

      - name: Finalize the message
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/memo_queue.py finalize --kind weekly --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}"

      - name: Send memo email
        id: send
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 5
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MEMO_RECIPIENTS: ${{ secrets.MEMO_RECIPIENTS }}
        run: python scripts/send_memo.py --subject-file output/memo-final/subject.txt --html-file output/memo-final/email.html --out output/memo-final/outcome.json

      - name: Write the memo outcome
        id: outcome
        if: always() && steps.plan.outputs.go == 'true' && steps.send.outcome != 'skipped'
        run: python scripts/memo_queue.py outcome --kind weekly --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}" --send-outcome "${{ steps.send.outcome }}"

      - name: Upload the memo outcome
        if: always() && steps.plan.outputs.go == 'true' && steps.send.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: memo-outcome-weekly-${{ steps.plan.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/memo-outcome/
          retention-days: 30

      - name: Record the memo outcome
        id: record
        if: always() && steps.plan.outputs.go == 'true' && steps.send.outcome != 'skipped'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/memo_queue.py record --kind weekly --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}"

      - name: Chain the next queued week
        if: always() && steps.plan.outputs.more == 'true' && steps.record.outputs.terminal == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run weekly-memo.yml -f wake="chain-${{ github.run_id }}" || echo "::warning::the chained wake-up failed; the next validated refresh wakes the queue"

      - name: Fail on a week that will not be sent
        if: always() && steps.plan.outputs.alarm == 'true'
        run: |
          echo "::error::a week became ambiguous, failed or blocked; see the run summary and docs/memo/ledger-weekly.json"
          exit 1

      # ── manual run (no inputs): as before, never recorded ──────────────────

      - name: Use the current release asset (manual run)
        if: env.MEMO_MODE == 'manual'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_RELEASE_TOKEN: ${{ secrets.DATA_RELEASE_TOKEN }}
        run: |
          echo "Manual run (not recorded in the memo ledger)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p data
          [ "$DATA_RELEASE_REPO" = "$GITHUB_REPOSITORY" ] || export GH_TOKEN="${DATA_RELEASE_TOKEN:?DATA_RELEASE_REPO names another repo but the DATA_RELEASE_TOKEN secret is not set}"
          gh release download data-latest --pattern macro_radar.db --dir data --clobber --repo "$DATA_RELEASE_REPO"
          echo "Manual run: using the current data-latest asset"
          python scripts/validate_db.py data/macro_radar.db --mode verify-only --allow-stale "memo input: validated upstream"

      - name: Ensure analytics are fresh (manual run)
        if: env.MEMO_MODE == 'manual'
        run: |
          python -m src.analytics.surprise
          python -m src.analytics.backtest
          python -m src.analytics.alerts
          python -m src.analytics.priced
          python -m src.analytics.playbook

      - name: Generate weekly memo (manual run)
        if: env.MEMO_MODE == 'manual'
        run: python -m src.memo

      - name: Build the email (manual run)
        if: env.MEMO_MODE == 'manual'
        run: |
          mkdir -p docs/memo output/manual
          cp output/weekly_memo.html docs/memo/weekly_memo.html
          cat > output/email_header.html << 'EOF2'
          <div style="font-family: Arial, sans-serif; font-size: 16px; padding: 15px; background-color: #f0f4f8; border-radius: 8px; margin-bottom: 20px;">
            📊 <a href="https://maxkomen-macro.github.io/macro-regime-radar/memo/weekly_memo.html" style="color: #1f77b4; text-decoration: none; font-weight: bold;">View full memo with charts in your browser</a>
            &nbsp;|&nbsp;
            📈 <a href="https://macro-economic-radar.vercel.app/" style="color: #1f77b4; text-decoration: none; font-weight: bold;">Live Dashboard</a>
          </div>
          <hr style="border: 1px solid #ddd; margin-bottom: 20px;">
          EOF2
          cat output/email_header.html output/weekly_memo_email.html > output/email_body.html
          echo "Macro Regime Radar — Weekly Memo" > output/manual/subject.txt

      - name: Commit and push updated memo to GitHub Pages (manual run)
        if: env.MEMO_MODE == 'manual' && github.ref == 'refs/heads/main'
        timeout-minutes: 15
        run: |
          # Builds the commit in a fresh worktree of the current origin/main and
          # stages only the memo, so a PR merged while this run was in flight is
          # never undone. Five attempts with backoff; an unchanged memo makes no
          # commit. See scripts/publish_artifacts.sh.
          bash scripts/publish_artifacts.sh "Update weekly memo [skip ci]" docs/memo/weekly_memo.html

      - name: Send memo email (manual run)
        if: env.MEMO_MODE == 'manual'
        timeout-minutes: 5
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MEMO_RECIPIENTS: ${{ secrets.MEMO_RECIPIENTS }}
        run: python scripts/send_memo.py --subject-file output/manual/subject.txt --html-file output/email_body.html --out output/manual/outcome.json

      - name: Clean up .env
        if: always()
        run: rm -f .env
