name: Daily Memo Email

# Produced only from a validated FULL refresh (2026-09-06): the Refresh Data
# workflow dispatches this one after a validated morning full run on a
# weekday, passing its run id; the memo consumes that run's validated
# database artifact — the exact snapshot the validation gate passed. A
# manual dispatch without a run id uses the current data-latest asset. The
# memo commit goes through scripts/publish_artifacts.sh (a fresh worktree of
# current main, only the memo staged; never stash/rebase).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Refresh Data run id whose validated-db artifact to use (set automatically by the refresh workflow; leave empty for a manual run on the current Release asset)"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

env:
  # Private storage (Change 1): the repo whose data-latest release holds the
  # database, validation.json and snapshot-latest.json. Unset, it is this repo,
  # exactly as before. A different repo needs the DATA_RELEASE_TOKEN secret.
  # The earnings ledger steps never read it: the sealed ledger stays here.
  DATA_RELEASE_REPO: ${{ vars.DATA_RELEASE_REPO || github.repository }}

jobs:
  email-memo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download the validated snapshot from the dispatching run
        if: github.event.inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: validated-db
          path: validated
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this run produces a memo
        id: gate
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "manual run on the current Release asset"; exit 0
          fi
          if [ ! -f validated/refresh-meta.txt ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Run $RUN_ID carries no validated-db artifact — refusing to produce a memo from an unvalidated refresh."; exit 0
          fi
          MODE=$(grep '^mode=' validated/refresh-meta.txt | cut -d= -f2)
          if [ "$MODE" = "full" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "validated full refresh $RUN_ID — producing the memo"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "mode=$MODE — not a full refresh, no memo"
          fi

      - name: Set up Python 3.12
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Use the validated snapshot (or the current release on manual runs)
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_RELEASE_TOKEN: ${{ secrets.DATA_RELEASE_TOKEN }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          mkdir -p data
          if [ -f validated/macro_radar.db ]; then
            cp validated/macro_radar.db data/macro_radar.db
            echo "Using the validated artifact from run $RUN_ID"
          else
            [ "$DATA_RELEASE_REPO" = "$GITHUB_REPOSITORY" ] || export GH_TOKEN="${DATA_RELEASE_TOKEN:?DATA_RELEASE_REPO names another repo but the DATA_RELEASE_TOKEN secret is not set}"
            gh release download data-latest --pattern macro_radar.db --dir data --clobber --repo "$DATA_RELEASE_REPO"
            echo "Manual run: using the current data-latest asset"
          fi
          python scripts/validate_db.py data/macro_radar.db --mode verify-only --allow-stale "memo input: validated upstream"

      - name: Generate daily memo
        if: steps.gate.outputs.go == 'true'
        id: memo_meta
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          OUTPUT=$(python src/daily_memo.py)
          echo "$OUTPUT"
          MEMO_DATE=$(echo "$OUTPUT" | grep "^MEMO_DATE=" | cut -d= -f2)
          MEMO_REGIME=$(echo "$OUTPUT" | grep "^MEMO_REGIME=" | cut -d= -f2)
          echo "memo_date=$MEMO_DATE" >> "$GITHUB_OUTPUT"
          echo "memo_regime=$MEMO_REGIME" >> "$GITHUB_OUTPUT"

      - name: Copy memo to GitHub Pages location
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir -p docs/memo
          cp output/daily_memo.html docs/memo/daily_memo.html

      - name: Build email body with browser link
        if: steps.gate.outputs.go == 'true'
        run: |
          cat > output/email_header.html << 'EOF2'
          <div style="font-family: Arial, sans-serif; font-size: 16px; padding: 15px; background-color: #f0f4f8; border-radius: 8px; margin-bottom: 20px;">
            📊 <a href="https://maxkomen-macro.github.io/macro-regime-radar/memo/daily_memo.html" style="color: #1f77b4; text-decoration: none; font-weight: bold;">View this memo in your browser</a>
            &nbsp;|&nbsp;
            📈 <a href="https://macro-economic-radar.vercel.app/" style="color: #1f77b4; text-decoration: none; font-weight: bold;">Live Dashboard</a>
          </div>
          <hr style="border: 1px solid #ddd; margin-bottom: 20px;">
          EOF2
          cat output/email_header.html output/daily_memo.html > output/email_body.html

      - name: Commit and push updated memo to GitHub Pages
        if: steps.gate.outputs.go == 'true' && github.ref == 'refs/heads/main'
        timeout-minutes: 15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Builds the commit in a fresh worktree of the current origin/main and
          # stages only the memo, so a PR merged while this run was in flight is
          # never undone. Five attempts with backoff; an unchanged memo makes no
          # commit. See scripts/publish_artifacts.sh.
          bash scripts/publish_artifacts.sh "Update daily memo [skip ci]" docs/memo/daily_memo.html
          ls -la output/email_body.html

      - name: Send memo email
        if: steps.gate.outputs.go == 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "📊 Daily Briefing — ${{ steps.memo_meta.outputs.memo_date }} — ${{ steps.memo_meta.outputs.memo_regime }}"
          to: ${{ secrets.MEMO_RECIPIENTS }}
          from: Macro Radar <${{ secrets.GMAIL_ADDRESS }}>
          html_body: file://output/email_body.html
          attachments: output/daily_memo.html
