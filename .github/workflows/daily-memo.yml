name: Daily Memo Email

# CS-2 (Max 2026-11-05 item 6; design .loop/design-CS2.md v16): one daily memo per
# completed NYSE session, built from the first validated full refresh that covered
# that session, from a durable queue in git.
#
#   docs/memo/sources.json       which validated refresh attempt first covered each
#                                session (written only by refresh-data's "Record memo
#                                sources" step)
#   docs/memo/ledger-daily.json  each session's memo state: attempt, sending, sent,
#                                not_sent, ambiguous, failed, skipped or blocked
#
# Modes, from the inputs:
#   wake (or the legacy run_id)  automated: the plan walks the sessions in order from
#                                scripts/memo_queue.py QUEUE_START and claims one
#   resend_key                   an owner resend of a terminal session (docs/RUNBOOK.md)
#   none                         manual, as before: the current release asset, the page
#                                commit and the email, never recorded in the ledger
#
# Every ledger write is a compare-and-swap through scripts/publish_artifacts.sh
# --expect: a reviewed PR that edits the ledger is never overwritten; the run stops.
# Delivery: automation never sends a session again after SMTP may have accepted it
# (anything unclear is `ambiguous`, which only an owner resend can follow). That is
# at-most-once for automation with visible failures, not exactly-once delivery.

on:
  workflow_dispatch:
    inputs:
      wake:
        description: "Set by Refresh Data or a chained memo run: drain the memo queue (leave empty for a manual run)"
        type: string
        default: ""
      run_id:
        description: "Legacy wake-up from a pre-CS-2 refresh: treated as a wake-up only (leave empty)"
        type: string
        default: ""
      resend_key:
        description: "Owner resend: the session (YYYY-MM-DD) to send again; only a terminal ledger entry (docs/RUNBOOK.md)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write   # reads source runs' artifacts, uploads the outcome, chains the next run

# Automated and resend runs share one queue; a replaced pending run loses nothing,
# because every run drains from the durable records. A manual run has its own group.
concurrency:
  group: ${{ (inputs.wake != '' || inputs.run_id != '' || inputs.resend_key != '') && 'daily-memo-queue' || format('daily-memo-manual-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # Private storage (Change 1, docs/data/PRIVATE_STORAGE.md): the repo whose
  # data-latest release holds the database, validation.json,
  # snapshot-latest.json and the full refresh's attempt status. Unset, it is
  # this repo, exactly as before. A different repo needs the DATA_RELEASE_TOKEN secret.
  # The earnings ledger steps never read it: the sealed ledger stays here.
  DATA_RELEASE_REPO: ${{ vars.DATA_RELEASE_REPO || github.repository }}

jobs:
  email-memo:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MEMO_MODE: ${{ inputs.resend_key != '' && 'resend' || ((inputs.wake != '' || inputs.run_id != '') && 'auto' || 'manual') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure the git identity for memo commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── queued memo (automated or resend) ──────────────────────────────────

      - name: Plan the memo
        id: plan
        if: env.MEMO_MODE != 'manual' && github.ref == 'refs/heads/main'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKE: ${{ inputs.wake || inputs.run_id }}
          RESEND_KEY: ${{ inputs.resend_key }}
        run: python scripts/memo_queue.py plan --kind daily --wake "$WAKE" --resend-key "$RESEND_KEY"

      - name: Download the source snapshot
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          name: validated-db
          path: validated
          run-id: ${{ steps.plan.outputs.origin_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the source snapshot
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 10
        env:
          DB_SHA: ${{ steps.plan.outputs.db_sha256 }}
          VAL_SHA: ${{ steps.plan.outputs.validation_sha256 }}
          VALIDATED_AT: ${{ steps.plan.outputs.validated_at }}
        run: |
          python scripts/memo_queue.py verify --db validated/macro_radar.db --validation validated/validation.json \
            --db-sha256 "$DB_SHA" --validation-sha256 "$VAL_SHA"
          mkdir -p data
          cp validated/macro_radar.db data/macro_radar.db
          python scripts/validate_db.py data/macro_radar.db --mode verify-only --allow-stale "memo input: validated upstream at $VALIDATED_AT"

      - name: Pin the private copy to the session
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 10
        env:
          PIN: ${{ steps.plan.outputs.pin_session }}
        run: |
          python scripts/memo_queue.py pin --db data/macro_radar.db --session "$PIN"
          python scripts/memo_queue.py market-metrics --db data/macro_radar.db --session "$PIN"

      - name: Reserve the paid commentary
        id: reserve
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/memo_queue.py reserve --kind daily --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}"

      - name: Generate daily memo
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 20
        env:
          MEMO_SESSION: ${{ steps.plan.outputs.key }}
          MEMO_CLOCK: ${{ steps.plan.outputs.validated_at }}
          MEMO_COMMENTARY: ${{ steps.reserve.outputs.commentary }}
          # one call per provider per session, and only after the reservation (DR-57)
          ANTHROPIC_API_KEY: ${{ steps.reserve.outputs.commentary == 'paid' && secrets.ANTHROPIC_API_KEY || '' }}
          PERPLEXITY_API_KEY: ${{ steps.reserve.outputs.commentary == 'paid' && secrets.PERPLEXITY_API_KEY || '' }}
        run: python src/daily_memo.py

      - name: Publish the memo page and mark it sending
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/memo_queue.py publish --kind daily --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}"

      - name: Finalize the message
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/memo_queue.py finalize --kind daily --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}"

      - name: Send memo email
        id: send
        if: steps.plan.outputs.go == 'true'
        timeout-minutes: 5
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MEMO_RECIPIENTS: ${{ secrets.MEMO_RECIPIENTS }}
        run: |
          python scripts/send_memo.py --subject-file output/memo-final/subject.txt --html-file output/memo-final/email.html \
            --attach output/memo-final/daily_memo.html --out output/memo-final/outcome.json

      - name: Write the memo outcome
        id: outcome
        if: always() && steps.plan.outputs.go == 'true' && steps.send.outcome != 'skipped'
        run: python scripts/memo_queue.py outcome --kind daily --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}" --send-outcome "${{ steps.send.outcome }}"

      - name: Upload the memo outcome
        if: always() && steps.plan.outputs.go == 'true' && steps.send.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: memo-outcome-daily-${{ steps.plan.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/memo-outcome/
          retention-days: 30

      - name: Record the memo outcome
        id: record
        if: always() && steps.plan.outputs.go == 'true' && steps.send.outcome != 'skipped'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/memo_queue.py record --kind daily --key "${{ steps.plan.outputs.key }}" --mode "${{ steps.plan.outputs.mode }}"

      - name: Chain the next queued session
        if: always() && steps.plan.outputs.more == 'true' && steps.record.outputs.terminal == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run daily-memo.yml -f wake="chain-${{ github.run_id }}" || echo "::warning::the chained wake-up failed; the next validated refresh wakes the queue"

      - name: Fail on a session that will not be sent
        if: always() && steps.plan.outputs.alarm == 'true'
        run: |
          echo "::error::a session became ambiguous, failed or blocked; see the run summary and docs/memo/ledger-daily.json"
          exit 1

      # ── manual run (no inputs): as before, never recorded ──────────────────

      - name: Use the current release asset (manual run)
        if: env.MEMO_MODE == 'manual'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_RELEASE_TOKEN: ${{ secrets.DATA_RELEASE_TOKEN }}
        run: |
          echo "Manual run (not recorded in the memo ledger)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p data
          [ "$DATA_RELEASE_REPO" = "$GITHUB_REPOSITORY" ] || export GH_TOKEN="${DATA_RELEASE_TOKEN:?DATA_RELEASE_REPO names another repo but the DATA_RELEASE_TOKEN secret is not set}"
          gh release download data-latest --pattern macro_radar.db --dir data --clobber --repo "$DATA_RELEASE_REPO"
          echo "Manual run: using the current data-latest asset"
          python scripts/validate_db.py data/macro_radar.db --mode verify-only --allow-stale "memo input: validated upstream"

      - name: Generate daily memo (manual run)
        if: env.MEMO_MODE == 'manual'
        id: memo_meta
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          OUTPUT=$(python src/daily_memo.py)
          echo "$OUTPUT"
          MEMO_DATE=$(echo "$OUTPUT" | grep "^MEMO_DATE=" | cut -d= -f2)
          MEMO_REGIME=$(echo "$OUTPUT" | grep "^MEMO_REGIME=" | cut -d= -f2)
          echo "memo_date=$MEMO_DATE" >> "$GITHUB_OUTPUT"
          echo "memo_regime=$MEMO_REGIME" >> "$GITHUB_OUTPUT"

      - name: Build the email (manual run)
        if: env.MEMO_MODE == 'manual'
        env:
          MEMO_DATE: ${{ steps.memo_meta.outputs.memo_date }}
          MEMO_REGIME: ${{ steps.memo_meta.outputs.memo_regime }}
        run: |
          mkdir -p docs/memo output/manual
          cp output/daily_memo.html docs/memo/daily_memo.html
          cat > output/email_header.html << 'EOF2'
          <div style="font-family: Arial, sans-serif; font-size: 16px; padding: 15px; background-color: #f0f4f8; border-radius: 8px; margin-bottom: 20px;">
            📊 <a href="https://maxkomen-macro.github.io/macro-regime-radar/memo/daily_memo.html" style="color: #1f77b4; text-decoration: none; font-weight: bold;">View this memo in your browser</a>
            &nbsp;|&nbsp;
            📈 <a href="https://macro-economic-radar.vercel.app/" style="color: #1f77b4; text-decoration: none; font-weight: bold;">Live Dashboard</a>
          </div>
          <hr style="border: 1px solid #ddd; margin-bottom: 20px;">
          EOF2
          cat output/email_header.html output/daily_memo.html > output/email_body.html
          printf '📊 Daily Briefing — %s — %s\n' "$MEMO_DATE" "$MEMO_REGIME" > output/manual/subject.txt

      - name: Commit and push updated memo to GitHub Pages (manual run)
        if: env.MEMO_MODE == 'manual' && github.ref == 'refs/heads/main'
        timeout-minutes: 15
        run: |
          # Builds the commit in a fresh worktree of the current origin/main and
          # stages only the memo, so a PR merged while this run was in flight is
          # never undone. Five attempts with backoff; an unchanged memo makes no
          # commit. See scripts/publish_artifacts.sh.
          bash scripts/publish_artifacts.sh "Update daily memo [skip ci]" docs/memo/daily_memo.html

      - name: Send memo email (manual run)
        if: env.MEMO_MODE == 'manual'
        timeout-minutes: 5
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MEMO_RECIPIENTS: ${{ secrets.MEMO_RECIPIENTS }}
        run: |
          python scripts/send_memo.py --subject-file output/manual/subject.txt --html-file output/email_body.html \
            --attach output/daily_memo.html --out output/manual/outcome.json
