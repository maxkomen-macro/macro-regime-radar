<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500" font-family="IBM Plex Sans, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b929e"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8b447"/></marker></defs><rect width="1400" height="500" fill="#0c0e11"/><text x="40" y="40" fill="#6b7280" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="2">DEPLOYMENT · ACTIONS → RELEASE ASSET → RENDER API → VERCEL WEB</text><rect x="40" y="80" width="210" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="145.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">GitHub Actions</text><text x="145.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">refresh-data.yml · 00:23 UTC daily</text><line x1="250" y1="116" x2="278" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="80" width="240" height="72" rx="10" fill="#151920" stroke="#e8b447"/><text x="400.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">build_snapshot + validate_db</text><text x="400.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">upload only if the gate passes and something changed</text><line x1="520" y1="116" x2="548" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="550" y="80" width="220" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="660.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">data-latest release</text><text x="660.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">the SQLite file · gh download</text><line x1="770" y1="116" x2="798" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="800" y="80" width="230" height="72" rx="10" fill="#151920" stroke="#58b8e6"/><text x="915.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Render · API image</text><text x="915.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">FastAPI in Docker · pulls the file at boot</text><line x1="1030" y1="116" x2="1058" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="1060" y="80" width="200" height="72" rx="10" fill="#151920" stroke="#26dca0"/><text x="1160.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Vercel · web</text><text x="1160.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">Root Directory web · static</text><line x1="915.0" y1="152" x2="915.0" y2="200" stroke="#e8b447" stroke-width="2" marker-end="url(#aa)" stroke-dasharray="6 4"/><rect x="745.0" y="202" width="340" height="64" rx="10" fill="#151920" stroke="#262b33"/><text x="915.0" y="230" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">worker.py builds one generation</text><text x="915.0" y="252" text-anchor="middle" fill="#8b929e" font-size="11.5">(id, built_at, as_of) · presets precomputed, cached by inputs_hash</text><line x1="1160.0" y1="152" x2="1160.0" y2="200" stroke="#e8b447" stroke-width="2" marker-end="url(#aa)" stroke-dasharray="6 4"/><rect x="1060.0" y="202" width="200" height="64" rx="10" fill="#151920" stroke="#26dca0"/><text x="1160.0" y="230" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">/api/desk/*</text><text x="1160.0" y="252" text-anchor="middle" fill="#8b929e" font-size="11.5">the envelope on every answer</text><text x="40" y="320" fill="#6b7280" font-size="11" font-family="IBM Plex Mono, monospace">WHAT A GENERATION IS</text><text x="40" y="348" fill="#c9cdd3" font-size="12">One in-memory copy of the store, migrated, stamped (id, built_at, as_of). A value's date always comes from the same response as the value. A worker restart is a new generation; the page never mixes two.</text><text x="40" y="372" fill="#c9cdd3" font-size="12">Study cache key: (generation id, generation key, effective cutoff, engine query). Different cutoffs never alias.</text><text x="40" y="416" fill="#6b7280" font-size="11" font-family="IBM Plex Mono, monospace">SECRETS · NAMES ONLY</text><text x="40" y="444" fill="#c9cdd3" font-size="12">Render: EODHD_API_TOKEN · OPS_ACCESS_KEY · GH_DB_TOKEN · ANTHROPIC_API_KEY · FINNHUB_API_KEY   Actions: FRED_API_KEY · NEWS_API_KEY · PERPLEXITY_API_KEY · VERCEL_DEPLOY_HOOK   Vercel: GH_SNAPSHOT_TOKEN</text><text x="40" y="468" fill="#c9cdd3" font-size="12">The web bundle reads no secrets. Full list with consumers: deploy/ENV.md.</text></svg>