<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="IBM Plex Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b929e"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8b447"/></marker>
  </defs>
  <rect width="1200" height="420" fill="#0c0e11"/>
  <text x="40" y="40" fill="#6b7280" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="2">HOW A NUMBER GETS TO THE SCREEN</text>

  <!-- main path boxes -->
  <g font-size="13">
    <rect x="40" y="90" width="160" height="72" rx="10" fill="#151920" stroke="#262b33"/>
    <text x="120" y="118" text-anchor="middle" fill="#e8e6e1" font-weight="600">Print</text>
    <text x="120" y="140" text-anchor="middle" fill="#8b929e" font-size="11.5">FRED · Yahoo · EODHD</text>

    <rect x="240" y="90" width="160" height="72" rx="10" fill="#151920" stroke="#262b33"/>
    <text x="320" y="118" text-anchor="middle" fill="#e8e6e1" font-weight="600">Nightly refresh</text>
    <text x="320" y="140" text-anchor="middle" fill="#8b929e" font-size="11.5">stamped: which run, when</text>

    <rect x="440" y="90" width="160" height="72" rx="10" fill="#151920" stroke="#e8b447"/>
    <text x="520" y="118" text-anchor="middle" fill="#e8e6e1" font-weight="600">Validation gate</text>
    <text x="520" y="140" text-anchor="middle" fill="#8b929e" font-size="11.5">dates · values · provenance</text>

    <rect x="640" y="90" width="160" height="72" rx="10" fill="#151920" stroke="#262b33"/>
    <text x="720" y="118" text-anchor="middle" fill="#e8e6e1" font-weight="600">Published snapshot</text>
    <text x="720" y="140" text-anchor="middle" fill="#8b929e" font-size="11.5">pinned to a generation</text>

    <rect x="840" y="90" width="160" height="72" rx="10" fill="#151920" stroke="#58b8e6"/>
    <text x="920" y="118" text-anchor="middle" fill="#e8e6e1" font-weight="600">Engine</text>
    <text x="920" y="140" text-anchor="middle" fill="#8b929e" font-size="11.5">one generation, one answer</text>

    <rect x="1040" y="90" width="120" height="72" rx="10" fill="#151920" stroke="#26dca0"/>
    <text x="1100" y="118" text-anchor="middle" fill="#e8e6e1" font-weight="600">The card</text>
    <text x="1100" y="140" text-anchor="middle" fill="#8b929e" font-size="11.5">via the envelope</text>
  </g>

  <!-- arrows along main path -->
  <g stroke="#8b929e" stroke-width="2" marker-end="url(#arr)">
    <line x1="200" y1="126" x2="238" y2="126"/>
    <line x1="400" y1="126" x2="438" y2="126"/>
    <line x1="600" y1="126" x2="638" y2="126"/>
    <line x1="800" y1="126" x2="838" y2="126"/>
    <line x1="1000" y1="126" x2="1038" y2="126"/>
  </g>

  <!-- stop 1: validation fails -->
  <line x1="520" y1="162" x2="520" y2="230" stroke="#e8b447" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <rect x="420" y="232" width="200" height="64" rx="10" fill="#1a160f" stroke="#5a4a1e"/>
  <text x="520" y="256" text-anchor="middle" fill="#e8b447" font-weight="600" font-size="12.5">Stop 1 · gate fails</text>
  <text x="520" y="278" text-anchor="middle" fill="#c9cdd3" font-size="11.5">nothing publishes · old snapshot stays live</text>

  <!-- stop 2: engine declines -->
  <line x1="920" y1="162" x2="920" y2="230" stroke="#e8b447" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <rect x="820" y="232" width="200" height="64" rx="10" fill="#1a160f" stroke="#5a4a1e"/>
  <text x="920" y="256" text-anchor="middle" fill="#e8b447" font-weight="600" font-size="12.5">Stop 2 · engine declines</text>
  <text x="920" y="278" text-anchor="middle" fill="#c9cdd3" font-size="11.5">card shows its labels and the reason</text>

  <!-- envelope legend -->
  <g font-size="11.5">
    <text x="40" y="340" fill="#6b7280" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5">THE ENVELOPE, ON EVERY ANSWER</text>
    <circle cx="48" cy="368" r="5" fill="#26dca0"/><text x="62" y="372" fill="#c9cdd3">ready · a number, with its own date</text>
    <circle cx="328" cy="368" r="5" fill="#58b8e6"/><text x="342" y="372" fill="#c9cdd3">computing · quiet, then retry</text>
    <circle cx="588" cy="368" r="5" fill="#e8b447"/><text x="602" y="372" fill="#c9cdd3">awaiting · labels kept, reason shown, no number</text>
    <circle cx="948" cy="368" r="5" fill="#e5534b"/><text x="962" y="372" fill="#c9cdd3">error · the message, nothing else</text>
    <text x="40" y="400" fill="#6b7280">What the gate rejects: a malformed date, a non-numeric value, a future-dated row, a row with no record of how it got there. Any one of them stops the whole publish.</text>
  </g>
</svg>
