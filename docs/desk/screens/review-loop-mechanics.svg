<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" width="1400" height="430" font-family="IBM Plex Sans, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b929e"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8b447"/></marker></defs><rect width="1400" height="430" fill="#0c0e11"/><text x="40" y="40" fill="#6b7280" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="2">REVIEW LOOP · EVERY BRANCH, BEFORE IT MERGES</text><rect x="40" y="80" width="230" height="72" rx="10" fill="#151920" stroke="#58b8e6"/><text x="155.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Claude Code builds</text><text x="155.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">one branch · explicit-path staging · no push</text><line x1="270" y1="116" x2="298" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="80" width="230" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="415.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Independent verifier</text><text x="415.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">a second agent reruns every claim</text><line x1="530" y1="116" x2="558" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="560" y="80" width="230" height="72" rx="10" fill="#151920" stroke="#e8b447"/><text x="675.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Codex reviews</text><text x="675.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">read-only sandbox · reproduces, doesn't trust</text><line x1="790" y1="116" x2="818" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="80" width="230" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="935.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Numbered findings</text><text x="935.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">blocking · high · low, with repro + file:line</text><line x1="1050" y1="116" x2="1078" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="1080" y="80" width="170" height="72" rx="10" fill="#151920" stroke="#26dca0"/><text x="1165.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">PUSH OK</text><text x="1165.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">only then do I push</text><line x1="935.0" y1="152" x2="935.0" y2="200" stroke="#e8b447" stroke-width="2" marker-end="url(#aa)" stroke-dasharray="6 4"/><rect x="685.0" y="202" width="500" height="64" rx="10" fill="#151920" stroke="#262b33"/><text x="935.0" y="230" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">DO NOT PUSH → fix prompt → next round</text><text x="935.0" y="252" text-anchor="middle" fill="#8b929e" font-size="11.5">each fix carries the reviewer's own repro as a test that fails on the old code</text><text x="40" y="320" fill="#6b7280" font-size="11" font-family="IBM Plex Mono, monospace">REVIEW KINDS</text><text x="40" y="348" fill="#c9cdd3" font-size="12">A numbers: look-ahead, off-by-one horizons, baselines, bootstrap units, cache aliasing   B language + regression: banned words, every number traces to a field, the gate can't be bypassed</text><text x="40" y="372" fill="#c9cdd3" font-size="12">C integration: what widened, does the app boot without the new tables, lock files byte-identical   D document: can two sessions build to this spec without meeting?</text><text x="40" y="412" fill="#c9cdd3" font-size="12">Nothing merged on the strength of its own tests. Every round is in docs/desk/*_REPORT.md: what was found, what was fixed, what was accepted and why.</text></svg>