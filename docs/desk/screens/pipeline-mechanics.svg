<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" font-family="IBM Plex Sans, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b929e"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8b447"/></marker></defs><rect width="1400" height="520" fill="#0c0e11"/><text x="40" y="40" fill="#6b7280" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="2">DATA PIPELINE · FETCH → VALIDATE → PROVENANCE → SNAPSHOT</text><rect x="40" y="80" width="190" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="135.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Provider</text><text x="135.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">FRED · Yahoo · EODHD</text><line x1="230" y1="116" x2="268" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="80" width="200" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="370.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">refresh()</text><text x="370.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">desk_history.py · 00:23 UTC</text><line x1="470" y1="116" x2="508" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="510" y="80" width="200" height="72" rx="10" fill="#151920" stroke="#58b8e6"/><text x="610.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">desk_series</text><text x="610.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">each row: run_id + ingested_at</text><line x1="710" y1="116" x2="748" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="750" y="80" width="210" height="72" rx="10" fill="#151920" stroke="#e8b447"/><text x="855.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">validate_db.py</text><text x="855.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">every check mandatory</text><line x1="960" y1="116" x2="998" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="1000" y="80" width="200" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="1100.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">data-latest</text><text x="1100.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">GitHub release asset</text><line x1="1200" y1="116" x2="1238" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="1240" y="80" width="160" height="72" rx="10" fill="#151920" stroke="#26dca0"/><text x="1320.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">API copy</text><text x="1320.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">one generation</text><line x1="370.0" y1="152" x2="370.0" y2="200" stroke="#e8b447" stroke-width="2" marker-end="url(#aa)" stroke-dasharray="6 4"/><rect x="255.0" y="202" width="230" height="64" rx="10" fill="#151920" stroke="#262b33"/><text x="370.0" y="230" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">One savepoint per series</text><text x="370.0" y="252" text-anchor="middle" fill="#8b929e" font-size="11.5">a bad series fails alone</text><line x1="610.0" y1="152" x2="610.0" y2="200" stroke="#e8b447" stroke-width="2" marker-end="url(#aa)" stroke-dasharray="6 4"/><rect x="495.0" y="202" width="230" height="64" rx="10" fill="#151920" stroke="#262b33"/><text x="610.0" y="230" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">desk_series_runs</text><text x="610.0" y="252" text-anchor="middle" fill="#8b929e" font-size="11.5">started → committed · NY date</text><line x1="855.0" y1="152" x2="855.0" y2="200" stroke="#e8b447" stroke-width="2" marker-end="url(#aa)" stroke-dasharray="6 4"/><rect x="740.0" y="202" width="230" height="64" rx="10" fill="#151920" stroke="#262b33"/><text x="855.0" y="230" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Fails → nothing publishes</text><text x="855.0" y="252" text-anchor="middle" fill="#8b929e" font-size="11.5">old snapshot stays live</text><line x1="1100.0" y1="152" x2="1100.0" y2="200" stroke="#e8b447" stroke-width="2" marker-end="url(#aa)" stroke-dasharray="6 4"/><rect x="985.0" y="202" width="230" height="64" rx="10" fill="#151920" stroke="#262b33"/><text x="1100.0" y="230" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">desk_series_quarantine</text><text x="1100.0" y="252" text-anchor="middle" fill="#8b929e" font-size="11.5">future-dated rows, as text</text><text x="40" y="320" fill="#6b7280" font-size="11" font-family="IBM Plex Mono, monospace">WHAT THE READER ACCEPTS</text><circle cx="48" cy="346" r="5" fill="#26dca0"/><text x="62" y="350" fill="#c9cdd3" font-size="12">a row whose run committed, dated on or before that run's New York date</text><circle cx="48" cy="374" r="5" fill="#e8b447"/><text x="62" y="378" fill="#c9cdd3" font-size="12">set aside, counted, named in the study's warnings, in the study's hash: no run_id · malformed date · before 1900 · after the cutoff · non-numeric</text><circle cx="48" cy="402" r="5" fill="#e5534b"/><text x="62" y="406" fill="#c9cdd3" font-size="12">a schema check that fails is an error, not "legacy": the study answers 503 with the reason, never a number</text><text x="40" y="450" fill="#6b7280" font-size="11" font-family="IBM Plex Mono, monospace">WRITE AND REPAIR</text><text x="40" y="478" fill="#c9cdd3" font-size="12">Only refresh() writes; write_series raises without provenance. --repair SERIES --apply takes the write lock before it selects, moves exactly the rows it reported, refuses over 10% without --force.</text></svg>