<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="IBM Plex Sans, system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b929e"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8b447"/></marker></defs><rect width="1400" height="560" fill="#0c0e11"/><text x="40" y="40" fill="#6b7280" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="2">EVENT STUDY · SHOCK → ENTRY → OUTCOME → BASELINE → RESAMPLE → VERDICT</text><rect x="40" y="80" width="200" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="140.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Shock</text><text x="140.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">z ≥ 2 over w sessions · or MA cross</text><line x1="240" y1="116" x2="266" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="268" y="80" width="200" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="368.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Condition</text><text x="368.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">checked on the shock day</text><line x1="468" y1="116" x2="494" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="496" y="80" width="230" height="72" rx="10" fill="#151920" stroke="#58b8e6"/><text x="611.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Entry</text><text x="611.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">event close if inputs ready, else next</text><line x1="726" y1="116" x2="752" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="754" y="80" width="220" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="864.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Outcome</text><text x="864.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">target move, entry → +h</text><line x1="974" y1="116" x2="1000" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="1002" y="80" width="190" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="1097.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Cooldown</text><text x="1097.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">t+1…t+w excluded</text><line x1="1192" y1="116" x2="1218" y2="116" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="1220" y="80" width="120" height="72" rx="10" fill="#151920" stroke="#26dca0"/><text x="1280.0" y="108" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Events</text><text x="1280.0" y="130" text-anchor="middle" fill="#8b929e" font-size="11.5">matched_n</text><rect x="40" y="210" width="300" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="190.0" y="238" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Baseline · same rule, every eligible day</text><text x="190.0" y="260" text-anchor="middle" fill="#8b929e" font-size="11.5">per study, per horizon · not thinned</text><line x1="340" y1="246" x2="368" y2="246" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="370" y="210" width="300" height="72" rx="10" fill="#151920" stroke="#58b8e6"/><text x="520.0" y="238" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Excess = median − baseline median</text><text x="520.0" y="260" text-anchor="middle" fill="#8b929e" font-size="11.5">log ×100 · or bp</text><line x1="670" y1="246" x2="698" y2="246" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="210" width="300" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="850.0" y="238" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Cluster resample</text><text x="850.0" y="260" text-anchor="middle" fill="#8b929e" font-size="11.5">overlapping windows → blocks</text><line x1="1000" y1="246" x2="1028" y2="246" stroke="#8b929e" stroke-width="2" marker-end="url(#a)"/><rect x="1030" y="210" width="280" height="72" rx="10" fill="#151920" stroke="#262b33"/><text x="1170.0" y="238" text-anchor="middle" fill="#e8e6e1" font-weight="600" font-size="13">Draws</text><text x="1170.0" y="260" text-anchor="middle" fill="#8b929e" font-size="11.5">≤7 blocks: all Bᴮ · else 10,000, seeded</text><text x="40" y="330" fill="#6b7280" font-size="11" font-family="IBM Plex Mono, monospace">VERDICT RULE v1 · at the selected horizon · verdicts use the engine's 90% interval, the selector never changes them</text><circle cx="48" cy="358" r="5" fill="#8b929e"/><text x="62" y="362" fill="#c9cdd3" font-size="12">Too few — under 10 completed outcomes at this horizon</text><circle cx="48" cy="386" r="5" fill="#26dca0"/><text x="62" y="390" fill="#c9cdd3" font-size="12">Reliable — ≥10 overlap blocks, interval on one side of zero, under 3% of resamples adverse (zero is adverse). This is the engine&apos;s own exclusion decision.</text><circle cx="48" cy="414" r="5" fill="#e8b447"/><text x="62" y="418" fill="#c9cdd3" font-size="12">Suggestive — ≥10 completed outcomes, excess median the same sign at 5, 10 and 20 sessions, but not Reliable</text><circle cx="48" cy="442" r="5" fill="#8b929e"/><text x="62" y="446" fill="#c9cdd3" font-size="12">No edge — ≥10 completed outcomes, neither of the above</text><text x="40" y="490" fill="#6b7280" font-size="11" font-family="IBM Plex Mono, monospace">REGIME AND IDENTITY</text><text x="40" y="518" fill="#c9cdd3" font-size="12">An event's regime is the stored row stamped two months before its month (K−2). By-regime stats are null under n &lt; 10. inputs_hash is the engine's native hash; horizons share one calculation.</text></svg>